# TheHive 5.2 – configuración mínima de laboratorio (Cassandra + índice Lucene local)
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql { cluster-name = thp, keyspace = thehive }
  }
  index.search {
    backend = lucene
    directory = /opt/thp/thehive/index
  }
}
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}
play.http.secret.key = "CHANGE_ME_RANDOM_SECRET"
